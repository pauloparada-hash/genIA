<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GenIA - Login</title>
    <link rel="stylesheet" href="login.css">
</head>
<body>
    <main class="tela-login">
        <div class="boas-vindas">
            <img src="GenIA.png" alt="GenIA" width="124" height="124">
            <h1>GenIA</h1>
            <h2>Bem-vindo de volta ao GenIA!</h2>
        </div>

        <div class="login">
            <form action="index.html">
                <fieldset>
                    <legend>Login</legend>

                    <div class="campo">
                        <label for="email">E-mail</label>
                        <input type="email" id="email" placeholder="seu@email.com" required>
                    </div>

                    <div class="campo">
                        <label for="senha">Senha</label>
                        <input type="password" id="senha" placeholder="Digite sua senha" required>
                    </div>
                </fieldset>

                <div class="botoes">
                    <button type="submit">Entrar</button>
                    <button type="reset">Limpar</button>
                </div>

                <div class="links">
                    <p>Esqueceu sua senha? <a href="esquecersenha.html">Recuperar senha</a></p>
                    <p>Não tenho cadastro? <a href="cadastro.html">Cadastrar-se</a></p>
                </div>
            </form>
        </div>
    </main>
</body>
</html>
