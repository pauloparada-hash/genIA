<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GenIA - Cadastro</title>
    <link rel="stylesheet" href="cadastro.css">
</head>
<body>
    <main class="tela-cadastro">
        <div class="boas-vindas">
            <img src="GenIA.png" alt="GenIA" width="124" height="124">
            <h1>GenIA</h1>
            <h2>Crie sua conta e comece a estudar com a GenIA!</h2>
        </div>

        <div class="cadastro">
            <form>
                <fieldset>
                    <legend>Cadastro</legend>

                    <div class="linha">
                        <div class="campo">
                            <label for="nome">Nome</label>
                            <input type="text" id="nome" name="nome" placeholder="Seu nome" required>
                        </div>

                        <div class="campo">
                            <label for="sobrenome">Sobrenome</label>
                            <input type="text" id="sobrenome" name="sobrenome" placeholder="Seu sobrenome" required>
                        </div>
                    </div>

                    <div class="campo">
                        <label for="email">E-mail</label>
                        <input type="email" id="email" name="email" placeholder="seu@email.com" required>
                    </div>

                    <div class="linha">
                        <div class="campo">
                            <label for="idade">Idade</label>
                            <input type="number" id="idade" name="idade" min="1" placeholder="Ex: 16" required>
                        </div>

                        <div class="campo">
                            <label for="data">Data de nascimento</label>
                            <input type="date" id="data" name="data" required>
                        </div>
                    </div>

                    <div class="campo">
                        <label for="senha">Senha</label>
                        <input type="password" id="senha" name="senha" placeholder="Crie uma senha" required>
                    </div>

                    <div class="campo">
                        <label for="senha">Confirme a Senha</label>
                        <input type="password" id="senha" name="senha" placeholder="Repita a senha" required>
                    </div>
                </fieldset>

                <div class="botoes">
                    <button type="submit">Cadastrar</button>
                    <button type="reset">Limpar</button>
                </div>

                <div class="links">
                    <p>Já tem cadastro? <a href="login.html">Entrar</a></p>
                </div>
            </form>
        </div>
    </main>
</body>
</html>
