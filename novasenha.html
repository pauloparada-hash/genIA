<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GenIA</title>
    <link rel="stylesheet" href="novasenha.css">
</head>
<body>
    <main class="tela-nova-senha">
        <div class="recuperacao">
            <img src="GenIA.png" alt="GenIA" width="124" height="124">
            <h1>GenIA</h1>
            <h2>Vamos recuperar o seu acesso!</h2>
        </div>

        <div class="novasenha">
            <form action="index.html">
                <fieldset>
                    <legend>Nova Senha</legend>

                        <div class="campo">
                            <label for="senha">Nova Senha</label>
                            <input type="password" id="senha" placeholder="Digite sua nova senha" required>
                        </div>

                        <div class="campo">
                            <label for="confirmar-senha">Confirmar Nova Senha</label>
                            <input type="password" id="confirmar-senha" placeholder="Repita sua nova senha" required>
                        </div>

                </fieldset>

                <div class="botoes">
                    <button type="submit">Salvar Nova Senha</button>
                    <button type="reset">Limpar</button>
                </div>

                <div class="links">
                    <p>Esqueceu sua senha? <a href="esquecersenha.html">Recuperar senha</a></p>
                    <p>Não tenho cadastro? <a href="cadastro.html">Cadastrar-se</a></p>
                </div>
            </form>
        </div>
    </main>
</body>
</html>
