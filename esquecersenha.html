<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GenIA - Recuperar senha</title>
    <link rel="stylesheet" href="login.css">
</head>
<body>
    <main class="tela-login">
        <div class="boas-vindas">
            <img src="GenIA.png" alt="GenIA" width="124" height="124">
            <h1>GenIA</h1>
            <h2>Vamos recuperar o seu acesso!</h2>
        </div>

        <div class="login">
            <form action="novasenha.html">
                <fieldset>
                    <legend>Esqueci minha senha</legend>

                    <p class="descricao">
                        Digite o e-mail cadastrado e enviaremos as instruções para criar uma nova senha.
                    </p>

                    <div class="campo">
                        <label for="email">E-mail</label>
                        <input type="email" id="email" placeholder="seu@email.com" required>
                    </div>
                </fieldset>

                <div class="botoes">
                    <button type="submit">Enviar</button>
                    <button type="reset">Limpar</button>
                </div>

                <div class="links">
                    <p>Lembrou a senha? <a href="login.html">Voltar ao login</a></p>
                </div>
            </form>
        </div>
    </main>
</body>
</html>
